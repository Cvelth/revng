---
Architecture: x86_64
DefaultABI: SystemV_x86_64
TypeDefinitions:
  - Kind: CABIFunctionDefinition
    ID: 0
    Comment: |-
      This is a c abi function type.

      IMPORTANT: this is not a function, so the comment is flat!

      \param this param is a part of the entire thing, not something
      attached to an element.
    ABI: SystemV_x86_64
    Name: my_function_type
    ReturnType:
      Kind: PrimitiveType
      PrimitiveKind: Signed
      Size: 8
    Arguments:
      - Index: 0
        Type:
          Kind: PrimitiveType
          PrimitiveKind: Signed
          Size: 4
      - Index: 1
        Type:
          Kind: PointerType
          PointerSize: 8
          PointeeType:
            Kind: PointerType
            PointerSize: 8
            PointeeType:
              Kind: PrimitiveType
              PrimitiveKind: Signed
              Size: 1
